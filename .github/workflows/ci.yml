name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env: { NEXT_PUBLIC_SITE_URL: "http://localhost:3000", NEXT_PUBLIC_DEMO_MODE: "true" }
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with: { version: 2.109.1 }
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db supabase/tests
      - if: always()
        run: supabase stop --no-backup
